# No `url:` until a docs site is actually published somewhere reachable.
# The previous value (bart-turczynski.github.io/punycoder) 404s and has no
# publisher: it was built by .github/workflows, and the account that ran it is
# suspended. punycoder's GitLab `pages_access_level` is `private` and it has
# never deployed. Restore this key when a host is chosen; DESCRIPTION's URL:
# field must name the same site when it does.

template:
  bootstrap: 5

authors:
  "Bart Turczynski":
    href: https://turczynski.pl

home:
  title: "punycoder — Punycode & IDN Processing for R"

navbar:
  structure:
    left:  [intro, reference, articles, news, acknowledgments]
    right: [search, gitlab]
  components:
    acknowledgments:
      text: Acknowledgments
      href: https://gitlab.com/bart-turczynski/punycoder/-/blob/main/ACKNOWLEDGMENTS.md
    gitlab:
      icon: fab fa-gitlab fa-lg
      href: https://gitlab.com/bart-turczynski/punycoder
      aria-label: GitLab

reference:
  - title: "Host Normalization"
    desc: >
      Entry point for UTS#46 IDNA host normalization — maps a hostname to
      a canonical lowercase ASCII comparison form. Companions report the
      profile identity behind that mapping and the set of Unicode versions
      the build ships, any of which a caller can select per call.
    contents:
      - host_normalize
      - normalization_profile_info
      - unicode_versions

  - title: "Punycode Codec"
    desc: >
      Low-level RFC 3492 encoder/decoder for individual domain labels
      (`xn--` ASCII-Compatible Encoding).
    contents:
      - puny_encode
      - puny_decode

  - title: "Validators"
    desc: Predicates for classifying domain names and labels.
    contents:
      - validate_domain
      - is_idn
      - is_punycode

  - title: "Internals"
    desc: S3 print and summary methods, and package overview.
    contents:
      - punycoder-package
      - starts_with("print.")
      - starts_with("summary.")

footer:
  structure:
    left: developed_by
    right: [built_with, related]
  components:
    related: >
      Related:
      <a href="https://CRAN.R-project.org/package=pslr">pslr</a> ·
      <a href="https://CRAN.R-project.org/package=rurl">rurl</a>

news:
  releases:
    - text: "punycoder 1.2.1"
      href: https://gitlab.com/bart-turczynski/punycoder/-/tags/v1.2.1
