# GitLab Pages is the publisher: the `pages` job in .gitlab-ci.yml builds this
# site on every push to main and leaves it in `public/`. The URL below is what
# `GET /projects/:id/pages` reports for this project (unique domains are
# enabled; turning them off would move the site to
# https://bart-turczynski.gitlab.io/punycoder instead, which is prettier but is
# a project-settings change, not a repo change).
#
# DESCRIPTION's `URL:` field must name this same site -- it deliberately does
# NOT yet, because `pages_access_level` is still `private` and the site has
# never deployed, so a CRAN URL check would hit a 404. Add it there in the same
# change that confirms the first deployment is publicly reachable.
url: https://punycoder-a165b3.gitlab.io

template:
  bootstrap: 5

authors:
  "Bart Turczynski":
    href: https://turczynski.pl

home:
  title: "punycoder — Punycode & IDN Processing for R"

navbar:
  structure:
    left:  [intro, reference, articles, news, acknowledgments]
    right: [search, gitlab]
  components:
    acknowledgments:
      text: Acknowledgments
      href: https://gitlab.com/bart-turczynski/punycoder/-/blob/main/ACKNOWLEDGMENTS.md
    gitlab:
      icon: fab fa-gitlab fa-lg
      href: https://gitlab.com/bart-turczynski/punycoder
      aria-label: GitLab

reference:
  - title: "Host Normalization"
    desc: >
      Entry point for UTS#46 IDNA host normalization — maps a hostname to
      a canonical lowercase ASCII comparison form. Companions report the
      profile identity behind that mapping and the set of Unicode versions
      the build ships, any of which a caller can select per call.
    contents:
      - host_normalize
      - normalization_profile_info
      - unicode_versions

  - title: "Punycode Codec"
    desc: >
      Low-level RFC 3492 encoder/decoder for individual domain labels
      (`xn--` ASCII-Compatible Encoding).
    contents:
      - puny_encode
      - puny_decode

  - title: "Validators"
    desc: Predicates for classifying domain names and labels.
    contents:
      - validate_domain
      - is_idn
      - is_punycode

  - title: "Internals"
    desc: S3 print and summary methods, and package overview.
    contents:
      - punycoder-package
      - starts_with("print.")
      - starts_with("summary.")

footer:
  structure:
    left: developed_by
    right: [built_with, related]
  components:
    related: >
      Related:
      <a href="https://CRAN.R-project.org/package=pslr">pslr</a> ·
      <a href="https://CRAN.R-project.org/package=rurl">rurl</a>

news:
  releases:
    - text: "punycoder 1.2.1"
      href: https://gitlab.com/bart-turczynski/punycoder/-/tags/v1.2.1
