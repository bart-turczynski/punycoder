# The fleet-ci local gate's settings: T0 (docs) and T1 (full) before every
# push, run by .fleet-ci/gate in the fleet image (fleet-ci README, "The
# .fleet-ci.yml file"; seor ADR 0012). Read from the pushed commit.
version: 1

# The image the gate runs in. fleet-r-idn2 carries libidn2, so the native
# backend is built and the libidn2-vs-fallback parity tests run instead of
# skipping. It must be .gitlab-ci.yml's FLEET_RELEASE_VARIANT.
variant: fleet-r-idn2

# Allowlisted paths a gate or test here reads, so a change to them is never
# docs-only: scripts/gates-news-version.sh checks the release link in
# _pkgdown.yml, and scripts/check-bugreports.py reads it for tracker links.
docs_exclude:
  - _pkgdown.yml

# T0, and the start of T1. Genuine terms go in inst/WORDLIST (SEOR-mtbzfroz).
docs_gates:
  - Rscript -e 'bad <- spelling::spell_check_package(); if (nrow(bad)) { print(bad); quit(status = 1) }'

# T1, in the container after the dependency install, each run whatever the
# others report: man/, NAMESPACE and DESCRIPTION against a fresh roxygen2
# run (SEOR-nwfmerhu), lintr, README.md against a fresh knit, the NEWS
# heading against the version, and every declared URL (the gate's R CMD
# check runs with remote incoming, and so its URL check, off).
cheap_gates:
  - Rscript scripts/check-docs-drift.R .
  - Rscript -e 'lints <- lintr::lint_package(); if (length(lints)) { print(lints); quit(status = 1) }'
  - sh scripts/check-readme-drift.sh
  - sh scripts/gates-news-version.sh
  - Rscript scripts/check-urls.R

# The gate runs R CMD check with NOT_CRAN=true, so skip_on_cran() no longer
# keeps these out of it. T2 runs both, as osv-audit and security-audit.
exclude_tests:
  - path: tests/testthat/test-osv.R
    why: queries osv.dev over the network; the osv-audit job runs it in T2
  - path: tests/testthat/test-security.R
    why: queries Sonatype OSS Index with credentials the gate does not have; the security-audit job runs it in T2

# Every skip R CMD check's test run may report; any other fails the gate.
allowed_skips:
  - reason: man/ not in tree
    why: test-spelling-aliases.R reads the source tree's man/, which an installed-package check lacks; R CMD check's codoc covers it there, devtools::test() runs it

# The top-level .md files the pkgdown site publishes; every other one (the
# agent files among them) is moved out before build_site() (SEOR-wqxhftpv).
# ARCHITECTURE.md and DECISIONS.md were already live when the keep-list
# landed and stay published.
pages_keep:
  - README.md
  - NEWS.md
  - LICENSE.md
  - CONTRIBUTING.md
  - SECURITY.md
  - CODE_OF_CONDUCT.md
  - THIRD_PARTY_NOTICES.md
  - ACKNOWLEDGMENTS.md
  - ARCHITECTURE.md
  - DECISIONS.md
