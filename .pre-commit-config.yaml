# The hygiene hooks, at commit and at push. Install with `pre-commit install`
# (both hook types, from default_install_hook_types below), then
# `.fleet-ci/pre-push --install`, which replaces pre-commit's pre-push hook
# with fleet-ci's: that hook runs the fleet-ci local gate (.fleet-ci/gate,
# settings in .fleet-ci.yml) on each pushed ref, then this file's pre-push
# stage. The gate itself, docs drift, lintr, spelling, the URL check and
# R CMD check, is in .fleet-ci.yml, never here: this file must not run
# .fleet-ci/gate (fleet-ci README, "The local gate").
#
# Over fleet-ci's hook, `pre-commit install` and
# `pre-commit install --hook-type pre-push` without -f move it to
# hooks/pre-push.legacy (pre-commit's migration mode), which still runs the
# gate first. `pre-commit install -f` (both types, from
# default_install_hook_types) and `pre-commit install -f --hook-type pre-push`
# delete it and drop the gate; `-f --hook-type pre-commit` leaves it alone.
# Re-run `.fleet-ci/pre-push --install` after either of the two.
default_install_hook_types: [pre-commit, pre-push]
#
# air (the R formatter) is intentionally NOT wired up here: this package has not
# adopted air (no air.toml), so enabling it would reformat the whole source tree
# in one churny pass. Adopting air is a separate, opt-in slice.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=5120']
      # Paths below are TOOL-OWNED: a generator writes their bytes, so a fixer
      # that "corrects" them is overwritten on the next run and the diff comes
      # back forever. The rule is rurl's RUL-008 -- tool- or upstream-owned
      # bytes are excluded, authored files are not.
      #
      # inst/testdata/ holds byte-sensitive conformance vectors (the per-version
      # Unicode IdnaTestV2 corpora and the RFC 3492 vectors).
      #
      # README.md is knitted from README.Rmd by devtools::build_readme(). Some
      # of the console output it captures has REAL trailing spaces -- they are
      # what the code prints (print.punycoder_validation emits "Domain:
      # test.com " and "Valid:  TRUE "). Stripping them makes the committed
      # README stop reproducing its own recorded output, so a fresh knit shows
      # spurious changes indistinguishable from a real behavior change. Edit
      # README.Rmd, which is authored and stays covered.
      #
      # R/RcppExports.R and src/RcppExports.cpp are written by
      # Rcpp::compileAttributes(); src/unicode_tables_*.{h,cpp} by
      # data-raw/generate_unicode_tables.R. Both emit a trailing blank line that
      # end-of-file-fixer strips and the next regeneration restores (measured:
      # strip R/RcppExports.R, re-run compileAttributes(), the file is byte
      # identical to HEAD again). For the Unicode tables it is worse than churn:
      # AGENTS.md makes "re-run the generator, confirm git diff src/ is empty"
      # the proof that adding a table set did not perturb the shipped ones, and
      # a fixer-edited file makes that check red for a reason unrelated to the
      # data.
      #
      # .fleet-ci/ is fleet-ci's bin/vendor output, which seor's fleet checker
      # requires byte for byte; re-run bin/vendor rather than editing it.
      - id: end-of-file-fixer
        exclude: &fixer-excludes '^(\.fleet-ci/|inst/testdata/|README\.md$|R/RcppExports\.R$|src/RcppExports\.cpp$|src/unicode_tables_.*\.(h|cpp)$)'
      - id: trailing-whitespace
        exclude: *fixer-excludes
      - id: check-merge-conflict
      - id: check-yaml
      - id: mixed-line-ending
        exclude: *fixer-excludes
      - id: check-case-conflict
  # British spellings in code, comments, string literals and tooling, which
  # the `spelling` hook below never reads: spell_check_package() covers
  # DESCRIPTION, roxygen, vignettes, README and NEWS only, and that gap let
  # British runtime messages ship (SEOR-xtmnpmae). Only the en-GB_to_en-US
  # dictionary is enabled, so this is not a general typo checker. codespell
  # skips dotfiles unless given --check-hidden, so .bestpractices.json is
  # skipped either way; it is listed so the intent survives a flag change.
  # Excluded: man/ (roxygen output; fix the roxygen source), the vendored
  # conformance vectors in inst/testdata/, src/unicode_tables_* (generated
  # from the upstream UCD), the tracker snapshot (data-raw/snapshot-tracker.sh
  # overwrites it wholesale) and .bestpractices.json (mirrors the live
  # bestpractices.dev entry), and .fleet-ci/ (fleet-ci's bin/vendor output).
  # roxygen2::roxygenise needs no allow-list: the en-GB_to_en-US dictionary
  # has no entry for it.
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        name: codespell (British spellings, en-GB_to_en-US; SEOR-xtmnpmae)
        args: [--builtin, en-GB_to_en-US]
        stages: [pre-commit, pre-push]
        exclude: '^(\.fleet-ci/|man/|inst/testdata/|src/unicode_tables_.*\.(h|cpp)$|dev/tracker-snapshot\.md$|\.bestpractices\.json$)'
  - repo: local
    hooks:
      # CITATION.cff's version: and .zenodo.json's "version" must name the
      # release DESCRIPTION's Version: points at (X.Y.Z.9000 -> X.Y.Z). Rule:
      # seor's design/adr/0001-citation-metadata-names-the-release.md. Offline,
      # stdlib-only, so it runs in seconds without the R toolchain.
      - id: check-citation
        name: citation metadata vs DESCRIPTION
        entry: python3 scripts/check-citation.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      # DESCRIPTION's BugReports:, man/punycoder-package.Rd and every tracker
      # link (codemeta.json, .bestpractices.json, CONTRIBUTING.md, SECURITY.md,
      # the intro vignette) name /-/work_items, and no human-facing file may
      # carry a /-/issues link (seor ADR 0011,
      # https://gitlab.com/bart-turczynski/seor/-/blob/main/design/adr/0011-bugreports-names-work-items.md).
      # The reasoning is in the script's docstring. Offline, stdlib-only, same
      # shape as check-citation above.
      - id: check-bugreports
        name: BugReports and tracker links name /-/work_items
        entry: python3 scripts/check-bugreports.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      # bestpractices-url.py is a maintainer tool that reads the network, so the
      # hook runs only its offline self-test, and only when the script changes.
      - id: bestpractices-url-self-test
        name: bestpractices-url self-test
        entry: python3 scripts/bestpractices-url.py --self-test
        language: system
        pass_filenames: false
        files: ^scripts/bestpractices-url\.py$
        stages: [pre-push]
      # Each NEWS.md bullet is one terse line a package user acts on or
      # notices, with no housekeeping bullets and no Internal section (seor's
      # fleet standard, "NEWS.md bullets"). scripts/check-news.py is ported
      # from seor unchanged. Offline, stdlib-only, same shape as
      # check-citation above; its self-test runs when the script changes.
      - id: news-terse
        name: NEWS.md bullets are one terse line
        entry: python3 scripts/check-news.py NEWS.md
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: news-terse-self-test
        name: check-news self-test
        entry: python3 scripts/check-news.py --self-test
        language: system
        pass_filenames: false
        files: ^scripts/check-news\.py$
        stages: [pre-push]
      # Warns, loudly, when this clone's pre-push hook is not fleet-ci's, so
      # the push ran without the gate. Warn-only by decision, time-boxed until
      # the hook is installed fleet-wide, then it fails. It only reads the
      # hook file; it never runs .fleet-ci/gate.
      - id: fleet-ci-hook-installed
        name: fleet-ci pre-push hook is installed (warn-only)
        entry: sh scripts/check-fleet-hook.sh
        language: system
        pass_filenames: false
        always_run: true
        verbose: true
        stages: [pre-push]
      # This machine's R toolchain against what the package pins: roxygen2
      # against Config/roxygen2/version, installed packages built under a newer
      # R, and the local pandoc against the fleet image's (.fleet-ci/toolchain),
      # so a local devtools::document() or build_readme() writes what the gate
      # accepts. The gate itself runs in the fleet image and does not depend
      # on this machine's library. Quick: one request, for CRAN's package
      # index (SEOR-hxxxkmws, SEOR-tcytizic).
      - id: check-toolchain
        name: toolchain matches what this package pins
        entry: Rscript scripts/check-toolchain.R
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
