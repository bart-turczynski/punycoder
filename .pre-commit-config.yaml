# Pre-commit gate, mirroring CI. Install with `pre-commit install` (pre-commit
# hooks) and `pre-commit install --hook-type pre-push` (the verify hook below).
#
# air (the R formatter) is intentionally NOT wired up here: this package has not
# adopted air (no air.toml), so enabling it would reformat the whole source tree
# in one churny pass. Adopting air is a separate, opt-in slice.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=5120']
      # Paths below are TOOL-OWNED: a generator writes their bytes, so a fixer
      # that "corrects" them is overwritten on the next run and the diff comes
      # back forever. The rule is rurl's RUL-008 -- tool- or upstream-owned
      # bytes are excluded, authored files are not.
      #
      # inst/testdata/ holds byte-sensitive conformance vectors (the per-version
      # Unicode IdnaTestV2 corpora and the RFC 3492 vectors).
      #
      # README.md is knitted from README.Rmd by devtools::build_readme(). Some
      # of the console output it captures has REAL trailing spaces -- they are
      # what the code prints (print.punycoder_validation emits "Domain:
      # test.com " and "Valid:  TRUE "). Stripping them makes the committed
      # README stop reproducing its own recorded output, so a fresh knit shows
      # spurious changes indistinguishable from a real behavior change. Edit
      # README.Rmd, which is authored and stays covered.
      #
      # R/RcppExports.R and src/RcppExports.cpp are written by
      # Rcpp::compileAttributes(); src/unicode_tables_*.{h,cpp} by
      # data-raw/generate_unicode_tables.R. Both emit a trailing blank line that
      # end-of-file-fixer strips and the next regeneration restores (measured:
      # strip R/RcppExports.R, re-run compileAttributes(), the file is byte
      # identical to HEAD again). For the Unicode tables it is worse than churn:
      # AGENTS.md makes "re-run the generator, confirm git diff src/ is empty"
      # the proof that adding a table set did not perturb the shipped ones, and
      # a fixer-edited file makes that check red for a reason unrelated to the
      # data.
      - id: end-of-file-fixer
        exclude: &fixer-excludes '^(inst/testdata/|README\.md$|R/RcppExports\.R$|src/RcppExports\.cpp$|src/unicode_tables_.*\.(h|cpp)$)'
      - id: trailing-whitespace
        exclude: *fixer-excludes
      - id: check-merge-conflict
      - id: check-yaml
      - id: mixed-line-ending
        exclude: *fixer-excludes
      - id: check-case-conflict
  # British spellings in code, comments, string literals and tooling, which
  # the `spelling` hook below never reads: spell_check_package() covers
  # DESCRIPTION, roxygen, vignettes, README and NEWS only, and that gap let
  # British runtime messages ship (SEOR-xtmnpmae). Only the en-GB_to_en-US
  # dictionary is enabled, so this is not a general typo checker. codespell
  # skips dotfiles unless given --check-hidden, so .bestpractices.json is
  # skipped either way; it is listed so the intent survives a flag change.
  # Excluded: man/ (roxygen output; fix the roxygen source), the vendored
  # conformance vectors in inst/testdata/, src/unicode_tables_* (generated
  # from the upstream UCD), the tracker snapshot (data-raw/snapshot-tracker.sh
  # overwrites it wholesale) and .bestpractices.json (mirrors the live
  # bestpractices.dev entry). roxygen2::roxygenise needs no allow-list: the
  # en-GB_to_en-US dictionary has no entry for it.
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        name: codespell (British spellings, en-GB_to_en-US; SEOR-xtmnpmae)
        args: [--builtin, en-GB_to_en-US]
        stages: [pre-commit, pre-push]
        exclude: '^(man/|inst/testdata/|src/unicode_tables_.*\.(h|cpp)$|dev/tracker-snapshot\.md$|\.bestpractices\.json$)'
  - repo: local
    hooks:
      # CITATION.cff's version: and .zenodo.json's "version" must name the
      # release DESCRIPTION's Version: points at (X.Y.Z.9000 -> X.Y.Z). Rule:
      # seor's design/adr/0001-citation-metadata-names-the-release.md. Offline,
      # stdlib-only, so it runs in seconds without the R toolchain.
      - id: check-citation
        name: citation metadata vs DESCRIPTION
        entry: python3 scripts/check-citation.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      # DESCRIPTION's BugReports: keeps the CRAN-incoming-safe /-/issues form
      # (and man/punycoder-package.Rd mirrors it), while every human-facing
      # file that names the tracker links /-/work_items (SEOR-ocbtrrnl). The
      # reasoning is in the script's docstring. Offline, stdlib-only, same
      # shape as check-citation above.
      - id: check-bugreports
        name: BugReports split (DESCRIPTION vs human-facing links)
        entry: python3 scripts/check-bugreports.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      # bestpractices-url.py is a maintainer tool that reads the network, so the
      # hook runs only its offline self-test, and only when the script changes.
      - id: bestpractices-url-self-test
        name: bestpractices-url self-test
        entry: python3 scripts/bestpractices-url.py --self-test
        language: system
        pass_filenames: false
        files: ^scripts/bestpractices-url\.py$
        stages: [pre-push]
      # Mirrors the CI verify gate: lintr then R CMD check --as-cran, failing on
      # any WARNING. Runs on push (not per commit) since a full check is slow.
      # Toolchain drift makes the gate red on a tree nobody changed, and it
      # arrives disguised as a code defect: a roxygen2 skew aborts the docs
      # guard, and a package built under a newer R than this one surfaces as an
      # R CMD check WARNING minutes into the expensive step below. This is
      # offline and instant, and it runs ahead of that step so the machine is
      # named as the cause in one line rather than found by elimination
      # (SEOR-tcytizic).
      - id: check-toolchain
        name: toolchain matches what this package pins
        entry: Rscript scripts/check-toolchain.R
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      # R CMD check skips its DESCRIPTION spelling check on a machine with no
      # English aspell/hunspell dictionary, so a typo first showed up in
      # win-builder's incoming NOTE. spelling bundles its own hunspell
      # dictionaries and also reads man/, vignettes, README and NEWS
      # (SEOR-mtbzfroz). Genuine terms go in inst/WORDLIST.
      - id: spelling
        name: spelling (en-US, inst/WORDLIST)
        entry: Rscript -e
        args:
          - 'bad <- spelling::spell_check_package(); if (nrow(bad)) { print(bad); quit(status = 1) }'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      # `entry` is scripts/verify-on-push.sh, which runs the lintr + rcmdcheck
      # command this hook used to spell inline, unchanged, except when the
      # push DESTINATION is a directory on this filesystem -- the local
      # archival mirror `backup`, where the gate verifies nothing because that
      # history already passed on its way to origin (PUNY-dopcsyjw, ported
      # from rurl's RURL-qkowfsdt). It reads the URL pre-commit re-exports as
      # $PRE_COMMIT_REMOTE_URL; anything it cannot positively identify as a
      # local mirror, origin included, runs the gate. Read the wrapper's header
      # before changing the predicate -- this is a scoped skip, not a hole.
      # `always_run: true` stays: the missing predicate was the remote, not the
      # file set.
      - id: verify
        name: verify (mirrors CI)
        entry: scripts/verify-on-push.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
        verbose: true
