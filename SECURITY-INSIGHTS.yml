header:
  schema-version: 2.2.0
  last-updated: '2026-10-03'
  last-reviewed: '2026-10-03'
  url: https://gitlab.com/bart-turczynski/punycoder/-/raw/main/SECURITY-INSIGHTS.yml
  comment: |
    OpenSSF Security Insights self-report for punycoder, a CRAN R package for
    RFC 3492 Punycode encoding/decoding and UTS #46 IDNA host normalization,
    with a C++ core. Maintained alongside SECURITY.md (human-readable policy)
    and .bestpractices.json (OpenSSF Best Practices badge self-assessment).

project:
  name: punycoder
  homepage: https://bart-turczynski.gitlab.io/punycoder/
  administrators:
    - name: Bart Turczynski
      email: bartek@turczynski.pl
      social: https://orcid.org/0000-0002-8788-7980
      primary: true
  documentation:
    quickstart-guide: https://bart-turczynski.gitlab.io/punycoder/
    detailed-guide: https://bart-turczynski.gitlab.io/punycoder/reference/index.html
    release-process: https://gitlab.com/bart-turczynski/punycoder/-/blob/main/CONTRIBUTING.md
  repositories:
    - name: punycoder
      url: https://gitlab.com/bart-turczynski/punycoder
      comment: |
        Sole repository for the punycoder package. It is the Punycode and IDNA
        engine for the sibling pslr and rurl packages.
  vulnerability-reporting:
    reports-accepted: true
    bug-bounty-available: false
    contact:
      name: Bart Turczynski
      email: bartek@turczynski.pl
      primary: true
    policy: https://gitlab.com/bart-turczynski/punycoder/-/blob/main/SECURITY.md
    in-scope:
      - Unsafe handling of untrusted Punycode or internationalized domain name
        input passed to the encoding, decoding, validation and normalization
        functions.
      - Memory-safety defects in the C++ codec core (buffer handling, UTF-8
        decoding, domain label parsing).
    out-of-scope:
      - Vulnerabilities in dependencies (Rcpp, the optional system libidn2);
        report those upstream.
    comment: |
      Please do not report vulnerabilities through public issues. Email the
      maintainer at bartek@turczynski.pl, or open a GitLab issue with the
      "This issue is confidential" box ticked. Acknowledgment is targeted
      within 7 days. punycoder makes no network connections of its own and
      handles no credentials.

repository:
  url: https://gitlab.com/bart-turczynski/punycoder
  status: active
  bug-fixes-only: false
  accepts-change-request: true
  accepts-automated-change-request: false
  no-third-party-packages: false
  core-team:
    - name: Bart Turczynski
      email: bartek@turczynski.pl
      social: https://orcid.org/0000-0002-8788-7980
      primary: true
  documentation:
    contributing-guide: https://gitlab.com/bart-turczynski/punycoder/-/blob/main/CONTRIBUTING.md
    security-policy: https://gitlab.com/bart-turczynski/punycoder/-/blob/main/SECURITY.md
  license:
    url: https://gitlab.com/bart-turczynski/punycoder/-/blob/main/LICENSE.md
    expression: MIT
  release:
    changelog: https://gitlab.com/bart-turczynski/punycoder/-/blob/main/NEWS.md
    automated-pipeline: false
    distribution-points:
      - uri: https://CRAN.R-project.org/package=punycoder
        comment: Canonical release channel (CRAN).
      - uri: https://gitlab.com/bart-turczynski/punycoder/-/releases
        comment: Tagged GitLab releases.
  security:
    assessments:
      self:
        evidence: https://www.bestpractices.dev/projects/13429
        date: '2026-10-03'
        comment: |
          Ongoing OpenSSF Best Practices badge self-assessment, tracked in
          .bestpractices.json at the repository root.
    champions:
      - name: Bart Turczynski
        email: bartek@turczynski.pl
        primary: true
    tools:
      - name: rosv (OSV)
        type: SCA
        rulesets:
          - default
        integration:
          adhoc: true
          ci: true
          release: false
        results: {}
        comment: |
          Audit of the dependency closure against the OSV database (osv.dev).
          No account or secrets required. Runs as the `osv-audit` job in
          .gitlab-ci.yml on the weekly dependency-audit pipeline schedule.
      - name: oysteR (Sonatype OSS Index)
        type: SCA
        rulesets:
          - default
        integration:
          adhoc: true
          ci: true
          release: false
        results: {}
        comment: |
          Audit of declared dependencies against the Sonatype OSS Index. Runs as
          the `security-audit` job in .gitlab-ci.yml on the weekly
          dependency-audit pipeline schedule, and fails when its credentials
          are missing rather than skipping green.
      - name: AddressSanitizer / UndefinedBehaviorSanitizer
        type: SAST
        rulesets:
          - default
        integration:
          adhoc: true
          ci: true
          release: false
        results: {}
        comment: |
          R CMD check of the package inside R-hub's clang-ASAN/UBSAN container,
          the `sanitizers` job in .gitlab-ci.yml, on the weekly deep-check
          pipeline schedule.
