# GitLab CI for punycoder: fleet-ci's template, pinned by commit SHA (seor
# ADR 0012, fleet-ci README "The CI template"). The template owns the event
# table, the jobs and the images; this file sets only the package's switches
# and settings. A push to main or a branch, and a merge request, create no
# pipeline: the merge gate is the local one (.fleet-ci/gate, run by the
# .fleet-ci/pre-push hook). T2 runs on the deep-check schedule
# (SCHEDULE_KIND=deep-check), T3 on a RELEASE=1 web pipeline and a v* tag.
#
# Bump the pin by changing `ref:` and re-running fleet-ci's bin/vendor at the
# same SHA, in one merge request: .fleet-ci/VERSION must equal `ref:`.
include:
  - project: bart-turczynski/fleet-ci
    ref: 66d8d2d4b888aeb00c4afad15d953a390fd2e9d8
    file: templates/r-package.yml

variables:
  # The release legs (t2-check-release, t2-ascran, coverage) run on the image
  # with libidn2, so the native backend and its parity tests are checked
  # there; oldrel, devel, the floor, the sanitizers, the locale leg and
  # t3-manual check the fallback build. .fleet-ci.yml's `variant` must name
  # the same image.
  FLEET_RELEASE_VARIANT: "fleet-r-idn2"
  # The declared floor, `Depends: R (>= 4.1.0)`: 4.1 is the oldest minor with
  # an arm64 rocker/r-ver image, which the runner needs. 2025-04-10 is the day
  # before R 4.5.0, when R 4.1 was still inside every dependency's support
  # window.
  FLEET_FLOOR_R: "4.1.3"
  FLEET_FLOOR_SNAPSHOT: "https://packagemanager.posit.co/cran/2025-04-10"
