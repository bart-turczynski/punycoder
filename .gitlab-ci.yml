# GitLab CI for punycoder.
#
# This replaces the eight GitHub Actions workflows that used to live in
# `.github/workflows/`. That whole tree was removed when the project went
# GitLab-only (PUNY-beydmanp): the GitHub account that ran it is suspended, so
# none of those workflows could execute any more.
#
# Job-name map from the workflows they replace, because CONTRIBUTING.md and
# `.bestpractices.json` cite job names (as of SEOR-pgammbgo below, `lint`,
# `readme`, `news-version` no longer exist as separate jobs -- they folded
# into `gates` -- so both files are now stale on that point; not fixed here,
# see the `gates:` job comment):
#
#   verify.yml         -> lint, readme, check, coverage
#   news-version.yaml  -> news-version
#   full-check.yml     -> full-check (R-version matrix; see the note on it)
#   pkgdown.yaml       -> pages
#   codemeta.yaml      -> codemeta (manual, artifact-only; see the note on it)
#   osv-audit.yml      -> osv-audit
#   security-audit.yml -> security-audit
#   rhub.yaml          -> sanitizers (R-hub's containers, run directly)
#
# The merge gate is `gates` (folding what used to be the separate `lint`,
# `readme`, `news-version` jobs -- SEOR-pgammbgo) + `citation-version` +
# `check` + `coverage`. `citation-version` stayed its own job rather than
# folding in too -- see the `gates:` job comment for why (its image has no
# python3 and adding one is not free). Everything else is manual,
# tag-triggered, or scheduled.
#
# SCHEDULE_KIND selects among pipeline-schedule-triggered jobs (SEOR-ihmntqzm).
# A scheduled pipeline alone is not a selector: this project intends more than
# one schedule (a weekly dependency audit and a weekly deep-check), and a job
# guarded only by `$CI_PIPELINE_SOURCE == "schedule"` fires on ANY of them.
# Each schedule sets `SCHEDULE_KIND` (a pipeline-schedule CI/CD variable, not
# defined here -- see Build > Pipeline schedules) to a value naming what it is
# for; each schedule-triggered job then requires both
# `$CI_PIPELINE_SOURCE == "schedule"` AND its own `$SCHEDULE_KIND`, so adding a
# schedule for one purpose cannot silently fire jobs meant for another. Two
# values are in use: `dependency-audit` (osv-audit, security-audit) and
# `deep-check` (full-check, sanitizers) -- the latter pair also
# runs on an API pipeline on `main` that sets `DEEP_CHECK=1`. See the `.audit` block below and the
# `full-check`/`sanitizers` jobs for where each is applied. Creating the
# schedules themselves is a separate, manual step (Build > Pipeline
# schedules) -- not done by this file.

stages:
  - lint
  - check
  - report
  - deploy
  - audit

default:
  # The fleet's jobs run only on the self-hosted Docker runners on the
  # maintainer's Mac, which carry this tag. Naming it makes that dependency
  # explicit: while the Mac sleeps, jobs sit pending and then fail as
  # `stuck_pending_no_matching_runners`, which is infrastructure, not code
  # (seor CONTRIBUTING.md, "Stuck-pending runbook"; SEOR-hhtzaknn).
  tags: [local-docker]

workflow:
  rules:
    # One pipeline per merge, not three (SEOR-bmgkzhvy). This used to allow
    # both merge-request and branch pipelines (suppressing the branch one only
    # when an MR was already open, GitLab's standard duplicate-pipeline
    # guard). That guard turned out not to be enough: this project runs on
    # self-hosted Docker runners on one Mac, not GitLab.com's shared runners,
    # with `concurrent = 4` in `~/.gitlab-runner/config.toml` -- a number this
    # project owns, not a platform limit (SEOR-gpafxhua; see seor's
    # design/adr/0003-fleet-ci-runs-on-self-hosted-runners.md for how this was
    # verified). Even with four slots, the branch and MR pipelines test the
    # same tree as the pipeline that eventually runs on main, and the useless
    # ones get created first -- so they hold slots the pipeline that actually
    # gates the work then queues behind. Measured repeatedly: a merged,
    # branch-deleted MR's own pipeline held a runner for 36+ minutes while
    # main sat pending. So both are suppressed outright and only main
    # (plus tags) gets a pipeline.
    #
    # Cost, stated plainly: a feature-branch push gets no CI at all -- that is
    # the point, not an oversight. An API-triggered pipeline on a non-default
    # branch also gets nothing, because $CI_COMMIT_BRANCH is set but isn't
    # $CI_DEFAULT_BRANCH, so it falls through to the last rule.
    #
    # A `web` pipeline is the deliberate exception, and it is what makes the
    # cost above bearable: someone has to open Build > Pipelines > Run
    # pipeline and choose a ref, so it cannot fire on its own and cannot
    # recreate the pile-up above, which was entirely push- and
    # merge-request-driven. Started against a feature branch it runs the whole
    # merge gate on that branch, and puts full-check and sanitizers one click
    # away -- which is exactly what one wants to run BEFORE merging, not
    # after. `pages` stays pinned to the default branch, so the hatch verifies
    # a branch and never publishes one.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"
    - when: never

# ---------------------------------------------------------------------------
# Shared R setup
#
# rocker/r-ver pins Posit Package Manager as the CRAN mirror, so
# `install.packages()` resolves Ubuntu *binaries* rather than compiling from
# source — the equivalent of `use-public-rspm: true` in the r-lib actions.
# {pak} does the dependency resolution and, running as root on a supported
# distro, installs each package's declared system requirements itself, so the
# apt lines below are only for things no R package declares (libidn2 for this
# package's optional backend, qpdf/ghostscript for --compact-vignettes).
# Pandoc is separate and pinned -- see the .pandoc block.
#
# `dependencies = TRUE` on the `deps::.` ref is not optional: without it pak
# resolves hard dependencies only, and `R CMD build` then dies with "vignette
# builder 'knitr' not found" because knitr and testthat are Suggests.
# ---------------------------------------------------------------------------
.r:
  image: rocker/r-ver:latest
  interruptible: true
  variables:
    R_LIBS_USER: "$CI_PROJECT_DIR/.Rlibs"
    R_KEEP_PKG_SOURCE: "yes"
    # Never set NOT_CRAN globally: it would un-skip test-osv.R and
    # test-security.R inside R CMD check, where their network access and
    # credentials are absent. The two audit jobs set it deliberately.
  cache:
    key: "rlibs-$CI_JOB_NAME_SLUG"
    paths:
      - .Rlibs/
  before_script:
    - mkdir -p "$R_LIBS_USER"
    # pak from r-lib's own binary repository, not CRAN: rocker/r-ver:devel has
    # no Posit Package Manager binaries, so a CRAN install.packages("pak")
    # builds from source, needs libcurl headers the image lacks, and fails with
    # only a warning -- the next step then dies on "no package called 'pak'"
    # (full-check R-devel, pipeline 2894951198). The r-lib repo serves a
    # self-contained build for every R version, so all three images take the
    # same path.
    - >
      Rscript -e 'if (!requireNamespace("pak", quietly = TRUE))
      install.packages("pak", repos = sprintf(
      "https://r-lib.github.io/p/pak/stable/%s/%s/%s",
      .Platform$pkgType, R.Version()$os, R.Version()$arch))'
    # Setting R_LIBS_USER above is NOT sufficient by itself (SEOR-dyzgzyot).
    # rocker/r-ver's Renviron.site defaults R_LIBS (not R_LIBS_USER) to
    # site-library:library whenever R_LIBS itself is unset, and that default
    # wins at session start -- so every package installed here went into the
    # image's site-library and died with the container, while the cache
    # faithfully preserved an empty .Rlibs/ every run. Verified directly
    # against this image:
    #
    #   $ docker run --rm -e R_LIBS_USER=/tmp/rlib rocker/r-ver:4.5.1 \
    #       Rscript -e '.libPaths()'
    #   [1] "/usr/local/lib/R/site-library" "/usr/local/lib/R/library"
    #
    # -- the cache directory does not even appear. Setting R_LIBS_SITE does
    # NOT fix this either; Renviron.site is read later and still wins.
    # Rprofile.site is read later still, so appending to it is what actually
    # moves the install target -- confirmed against the same image:
    #
    #   $ docker run --rm -e R_LIBS_USER=/tmp/rlib rocker/r-ver:4.5.1 sh -c '
    #       mkdir -p /tmp/rlib
    #       echo ".libPaths(c(Sys.getenv(\"R_LIBS_USER\"), .libPaths()))" \
    #         >> "${R_HOME}/etc/Rprofile.site"
    #       Rscript -e ".libPaths()"'
    #   [1] "/tmp/rlib"                     "/usr/local/lib/R/site-library"
    #   [3] "/usr/local/lib/R/library"
    #
    # site-library stays reachable behind the cache dir, so the image's own
    # packages (docopt, littler) still resolve. Do not remove this and leave
    # the R_LIBS_USER variable above looking like it does the job on its own.
    - echo '.libPaths(c(Sys.getenv("R_LIBS_USER"), .libPaths()))' >> "${R_HOME}/etc/Rprofile.site"
    - Rscript -e 'cat("Library paths:\n"); print(.libPaths())'

# Pandoc is PINNED, and the pin is load-bearing rather than tidiness.
#
# The `readme` job asserts that README.md is byte-identical to a fresh knit of
# README.Rmd, and pandoc's markdown writer changes its table layout between
# versions: the committed README carries compact pipe tables, while Ubuntu's
# apt pandoc (3.1.x) rewrites every table column-padded. The job then fails on
# whitespace, reporting "out of sync" for a reason that has nothing to do with
# the content. The GitHub workflow this replaced hid the problem by using
# setup-pandoc, which installs a pinned build.
#
# 3.10 is the version that reproduces the committed README.md byte for byte
# (verified locally). If you bump it, re-knit README.md in the same change and
# check that a maintainer's local pandoc matches, or the job goes red for
# everyone.
#
# The download is from pandoc's own release host. That is upstream software
# distribution, not a forge dependency -- the same category as the R-hub
# container images below.
#
# Written as a plain YAML anchor rather than `!reference`, deliberately: the
# pre-commit `check-yaml` hook parses this file with a safe loader and cannot
# construct GitLab's custom `!reference` tag, so using it makes every commit
# fail on an unresolvable constructor. GitLab flattens a nested array in
# `script`, so an anchor splices in exactly the same way.
#
# The ARCHITECTURE is derived, never asserted. pandoc ships one .deb per
# architecture (3.10 publishes both amd64 and arm64) and `dpkg -i` refuses a
# package built for another one, so a hardcoded `-amd64` takes out every job
# that splices this anchor the moment the runner is not x86_64 -- which is what
# happened the first time this pipeline ran on the project's own runner, a
# local gitlab-runner on Apple Silicon where Docker resolves rocker/r-ver to
# arm64. `dpkg --print-architecture` spells the value exactly as pandoc names
# its assets. It is command substitution rather than a variable on purpose:
# GitLab expands $VAR itself before the shell ever runs, but leaves $( ) alone,
# so this is evaluated in the container it has to describe.
#
# `dpkg -i` is bare, with no `|| apt-get install -f -y` fallback: the .deb is a
# self-contained binary with nothing to fix up, and the fallback only swallowed
# dpkg's exit status so the job died 200 lines later at `pandoc: command not
# found` instead of at the install that actually failed.
.pandoc_script: &pandoc_script
  - PANDOC_VERSION=3.10
  - apt-get update -qq && apt-get install -y --no-install-recommends curl ca-certificates
  - curl -fsSL -o /tmp/pandoc.deb "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-1-$(dpkg --print-architecture).deb"
  - dpkg -i /tmp/pandoc.deb
  - pandoc --version | head -n1

# ---------------------------------------------------------------------------
# Stage: lint — the fast checks, run on every push and merge request
# ---------------------------------------------------------------------------

# Folds the formerly-separate `lint`, `readme`, and `news-version` jobs into
# one (SEOR-pgammbgo). Each was cheap on its own -- well under a minute of
# real work combined -- but every GitLab job pays a roughly constant ~2
# minute tax for runner pickup, image pull, and before_script regardless of
# how little script it runs, so three thin jobs cost 3x that tax for one
# job's worth of checking.
#
# `check`, `coverage`, `pages`, `full-check`, `sanitizers`, `osv-audit`, and
# `security-audit` stay separate: each is a genuinely different failure
# meaning (build/test correctness, coverage regression, publish, a full
# R-version matrix, dynamic analysis, a security finding), not another
# instance of "the same kind of cheap check".
#
# Two of the five candidates the owner named for folding did NOT qualify and
# stay their own jobs:
#
# `citation-version` runs on `image: python:3.13-alpine`, not this job's
# `rocker/r-ver` (see `.r` above) -- and rocker/r-ver has no `python3` at all
# (verified directly: `docker run --rm rocker/r-ver:latest sh -c 'which
# python3'` -> nothing). Folding it in would mean either installing python3
# via apt on every merge forever just to save one runner pickup, or -- worse
# -- a harness step that silently exits 127 and reads as an ordinary FAIL.
# check-citation.py is deliberately offline, stdlib-only Python (see its own
# job comment below), which is exactly why it was given its own minimal
# interpreter image in the first place; that reasoning does not stop being
# true just because this fold exists. `glab ci lint` cannot catch this class
# of mistake -- it validates YAML, not whether a binary exists in the image a
# job's script assumes -- so this was confirmed by literally running the
# command in the image, not by inspecting the YAML.
#
# `codemeta` is not part of the merge gate today (`rules: web` +
# `when: manual` + `allow_failure: true` -- it only ever runs when someone
# starts it by hand), and its own script line,
# `git --no-pager diff -- codemeta.json || true`, can never fail the job --
# it is an artifact-generation step for a human to review the diff, not a
# pass/fail check. There is no red/green signal here to fold; folding it in
# would also silently change it from manual-only to running (and gating) on
# every push.
#
# BINDING CONDITION: scripts/gates.R runs every one of the three folded
# checks regardless of an earlier one failing, gives each its own PASS/FAIL,
# prints ONE summary naming every check's verdict, and only THEN exits
# nonzero if any failed -- ported from rurl's tools/verify.R
# (gitlab.com/bart-turczynski/rurl, tools/verify.R): it accumulates into a
# `results` list across every stage regardless of earlier failures and
# prints a single `VERDICT: FAIL -- <labels>` line before exiting. A
# fail-fast harness that stopped at the first red check would gut the point
# of this fold: three independent signals collapsed into one that still
# needed N re-runs to find the Nth failure. Proved by mutation: see the
# commit that introduced scripts/gates.R for what was broken, what the
# summary printed, and that it was restored afterwards.
#
# Before/after command enumeration (each former job's script, and what
# scripts/gates.R runs in its place) is in the body of the commit that
# introduced this job -- kept there rather than here so it cannot drift
# silently out of sync with a later edit to either side.
#
# What moved into this job's own script (below) vs. scripts/gates.R: package
# installation, apt packages, and pandoc are one-time SETUP shared by more
# than one of the three checks (lintr for lint; devtools + pandoc + git for
# readme; grep/sed/head -- all base-image tools, verified present -- for
# news-version) and are not themselves a gate, so they run here, once,
# exactly as rurl's `.r` template/before_script installs packages before
# `Rscript tools/verify.R` ever runs. scripts/gates.R contains only the
# three checks themselves.
gates:
  extends: .r
  stage: lint
  variables:
    # {lintr} reads this and turns any lint into a non-zero exit; read again
    # inside scripts/gates.R in case this job ever runs the script directly
    # (e.g. locally, outside this CI variable).
    LINTR_ERROR_ON_LINT: "true"
  script:
    - apt-get update -qq && apt-get install -y --no-install-recommends git
    - *pandoc_script
    - >
      Rscript -e 'pak::pak("deps::.", dependencies = TRUE);
      pak::pak(c("any::lintr", "any::devtools"))'
    - Rscript scripts/gates.R

# CITATION.cff and .zenodo.json each duplicate the version and the project
# URLs out of DESCRIPTION. Measured 2026-09-11, punycoder's CITATION.cff named
# a stale released version (1.2.0) after 1.2.1 shipped, the same class of drift
# as news-version's release-paperwork check but for a file that check does not
# touch. The rule is seor's
# design/adr/0001-citation-metadata-names-the-release.md: version: and
# "version" carry the release DESCRIPTION's Version: names (X.Y.Z.9000 ->
# X.Y.Z). Offline, stdlib-only Python, so it runs in seconds without the R
# image. NOT folded into `gates` -- see that job's comment for why: the R
# image this job's other checks share has no python3, verified directly, and
# this check's whole reason for a dedicated image is staying offline and
# stdlib-only.
#
# `check-bugreports.py` rides along here rather than getting a job of its own
# (SEOR-ocbtrrnl): DESCRIPTION's BugReports: keeps the CRAN-incoming-safe
# /-/issues form while human-facing tracker links name /-/work_items. It is
# stdlib-only, offline and instant, the same shape as check-citation.py, so
# it belongs in the job that already has a python3; a job of its own would
# pay the runner-pickup tax for about a second of work.
citation-version:
  stage: lint
  image: python:3.13-alpine
  script:
    - python3 scripts/check-citation.py --self-test
    - python3 scripts/check-citation.py
    - python3 scripts/check-bugreports.py --self-test
    - python3 scripts/check-bugreports.py

# ---------------------------------------------------------------------------
# Stage: check
# ---------------------------------------------------------------------------

check:
  extends: .r
  stage: check
  # Was needs: ["lint"] -- `lint` folded into `gates` (SEOR-pgammbgo).
  # `citation-version` stayed its own job and was never a `check` dependency
  # either before or after this fold; unchanged.
  needs: ["gates"]
  # Install the optional libidn2 backend so the native path and the
  # libidn2-vs-fallback parity tests actually exercise on CI.
  script:
    - apt-get update -qq && apt-get install -y --no-install-recommends libidn2-0-dev pkg-config qpdf ghostscript
    - *pandoc_script
    - Rscript -e 'pak::pak("deps::.", dependencies = TRUE); pak::pak("any::rcmdcheck")'
    # rcmdcheck reads a check that halted partway as 0/0/0 and returns normally,
    # so error_on never fires; the guard also fails on R CMD check's own exit
    # status (SEOR-maavnxdm).
    - >
      Rscript -e 'res <- rcmdcheck::rcmdcheck(args = "--no-manual",
      build_args = c("--no-manual", "--compact-vignettes=gs+qpdf"),
      error_on = "warning", check_dir = "check");
      if (!identical(as.integer(res$status), 0L)) stop("R CMD check exited with status ", res$status, "; the run did not complete.", call. = FALSE)'
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - check/

# Cross-platform coverage is the one thing leaving GitHub genuinely cost: this
# project has no macOS or Windows runner any more. What replaces it, per
# CONTRIBUTING.md's release checklist, is R's own pre-submission services --
# win-builder (devtools::check_win_devel()) and the macOS builder at
# https://mac.r-project.org/macbuilder/submit.html -- which are forge-independent
# and are what CRAN itself mirrors. This job keeps the R-VERSION half of the old
# matrix (devel / release / oldrel-1) on Linux.
#
# Runs on release tags ('v*'), on demand, and on the weekly deep-check
# schedule (SEOR-ihmntqzm; see the SCHEDULE_KIND comment near the top of
# this file). The manual `web` path was, in practice, the only way this ever
# ran outside a tag, because nobody starts a manual job on a schedule they
# forgot exists -- the new schedule rule below is what actually makes this
# release-shaped, multi-R-version check run unattended on a cadence, on a
# fleet with one runner that can now sleep between weekly passes instead of
# running this nightly. Routine merges and MRs use `check`.
#
# The `api` rule is the terminal trigger, so the release checklist can run this
# before a CRAN submission without opening the web UI:
#
#   glab ci run --branch main --variables DEEP_CHECK:1
#
# It starts the job outright (no `when: manual`, no `allow_failure`): whoever
# passed DEEP_CHECK=1 asked for this result, and a red one should read red.
# Only `main` qualifies, because the top-level `workflow:` rules give an API
# pipeline on any other branch nothing at all. A plain `glab ci run` without
# the variable still leaves this job out.
full-check:
  extends: .r
  stage: check
  image: $R_IMAGE
  variables:
    # Where `--as-cran`'s "checking CRAN incoming feasibility" reads CRAN's
    # metadata. By default that is the repos option's CRAN entry, which
    # rocker/r-ver points at p3m (see `.r`), and p3m serves neither
    # src/contrib/Meta/current.rds nor web/packages/packages.rds (404). For a
    # package already on CRAN the check halts at that step, and rcmdcheck reads
    # the cut-off log as "0 errors | 0 warnings | 0 notes", so the job goes
    # green having checked nothing (seen on raddr's CI, pipeline 2893490558).
    # These two variables move only that step to cloud.r-project.org; package
    # installs still come from p3m. The devel image already uses
    # cloud.r-project.org, where they change nothing. SEOR-ygzjighu.
    R_CRAN_SRC: "https://cloud.r-project.org"
    R_CRAN_WEB: "https://cloud.r-project.org"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
      allow_failure: true
    - if: $CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE_KIND == "deep-check"
    - if: $CI_PIPELINE_SOURCE == "api" && $DEEP_CHECK == "1"
  parallel:
    matrix:
      # 'latest' tracks the current R release; bump the pinned oldrel-1 tag
      # when a new minor R version ships.
      - R_IMAGE:
          - "rocker/r-ver:latest"
          - "rocker/r-ver:4.5"
          - "rocker/r-ver:devel"
  script:
    - apt-get update -qq && apt-get install -y --no-install-recommends libidn2-0-dev pkg-config qpdf ghostscript
    - *pandoc_script
    - Rscript -e 'pak::pak("deps::.", dependencies = TRUE); pak::pak("any::rcmdcheck")'
    # The strict CRAN-grade pass: --as-cran. This is what CRAN itself runs, so
    # it is the gate before a release.
    # rcmdcheck reads a check that halted partway as 0/0/0 and returns normally,
    # so error_on never fires; the guard also fails on R CMD check's own exit
    # status (SEOR-maavnxdm).
    - >
      Rscript -e 'res <- rcmdcheck::rcmdcheck(args = c("--no-manual", "--as-cran"),
      build_args = c("--no-manual", "--compact-vignettes=gs+qpdf"),
      error_on = "warning", check_dir = "check");
      if (!identical(as.integer(res$status), 0L)) stop("R CMD check exited with status ", res$status, "; the run did not complete.", call. = FALSE)'
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - check/

# Dynamic analysis of the C/C++ codec core, replacing rhub.yaml.
#
# R-hub v2 is GitHub-Actions-native -- `rhub::rhub_setup()` writes a workflow
# and `rhub::rhub_check()` dispatches it -- so there is nothing to port. But
# R-hub publishes its check environments as ordinary OCI images, and those run
# anywhere: this job pulls the clang-ASAN/UBSAN container directly and runs
# the check inside it. Same sanitizer, no GitHub.
#
# There is deliberately no valgrind leg (PUNY-pxdhoaov). R-hub's `valgrind`
# image is x86_64 and this project's runner is an arm64 Mac, so it runs under
# Rosetta 2 -- and no R process can start in it there. Its R is built with
# GCC 15, which compiles `machar_LD` (src/main/machar.c, inlined into
# `Init_R_Machine`, run at every R startup) using the x87 instruction
# `ffreep %st(0)` (bytes DF C0), which Rosetta does not implement: every
# `Rscript` dies with SIGILL, exit 132. clang, which builds the clang-asan
# image, does not emit it, which is why that leg runs fine under the same
# emulation. Located with a SIGILL handler in the image itself; it is in the
# image's prebuilt libR.so, so no flag of ours can avoid it. Do not re-add the
# matrix entry unless the runner is x86_64. Valgrind now comes from R-hub's
# own x86_64 runners, `rhub::rc_submit(platforms = "valgrind")`, before every
# CRAN submission (CONTRIBUTING.md, release checklist). A native arm64
# valgrind on rocker/r-ver does work, but that R is not built with valgrind
# instrumentation and is not CRAN's platform, so a green run there would look
# stronger than it is.
#
# `--ignore-vignettes` on the check, not `--no-build-vignettes`: the tarball is
# built without vignettes (no pandoc in the image, and vignettes are not what
# this job is for), and checking it with `--no-build-vignettes` reported two
# WARNINGs on every run (files in vignettes/ but no inst/doc; a vignette
# without its HTML), so a real WARNING could not be told apart from them.
# `--ignore-vignettes` skips every vignette check, including running the
# vignette's R code, so that code no longer runs under ASAN/UBSAN. The test
# suite exercises the same functions on the same classes of input.
#
# Manual and allow_failure on tag/web: sanitizer runs are slow and their
# output is for reading, not for gating a merge. The schedule rule below
# (SEOR-ihmntqzm; see the SCHEDULE_KIND comment near the top of this file)
# is what actually runs this on a cadence -- manual-only meant, in practice,
# never running -- on the weekly deep-check schedule, unattended and without
# `allow_failure`, since nobody is watching a scheduled pipeline the way a
# human triggering `web` would be. Still available before a release too, per
# CONTRIBUTING.md: `glab ci run --branch main --variables DEEP_CHECK:1` starts
# it, and full-check with it, straight from the terminal (the `api` rule; see
# the note on full-check).
sanitizers:
  stage: check
  image: ghcr.io/r-hub/containers/clang-asan
  interruptible: true
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
      when: manual
      allow_failure: true
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
      allow_failure: true
    - if: $CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE_KIND == "deep-check"
    - if: $CI_PIPELINE_SOURCE == "api" && $DEEP_CHECK == "1"
  variables:
    R_LIBS_USER: "$CI_PROJECT_DIR/.Rlibs"
  script:
    - mkdir -p "$R_LIBS_USER"
    - Rscript -e 'if (!requireNamespace("pak", quietly = TRUE)) install.packages("pak")'
    - Rscript -e 'pak::pak("deps::.", dependencies = TRUE)'
    - R CMD build --no-build-vignettes --no-manual .
    - R CMD check --no-manual --ignore-vignettes punycoder_*.tar.gz
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      # R CMD check run directly writes punycoder.Rcheck/ into the working
      # directory; the two rcmdcheck jobs redirect theirs to check/ instead.
      - "*.Rcheck/"

# ---------------------------------------------------------------------------
# Stage: report
# ---------------------------------------------------------------------------

# Coverage now goes to GitLab's native coverage reporting (the pipeline badge,
# the MR coverage diff, and the per-file annotations from the Cobertura report)
# rather than to Codecov. The old Codecov project was linked to the GitHub
# repository and cannot follow the move; GitLab's built-in reporting needs no
# external account and no token.
coverage:
  extends: .r
  stage: report
  needs: ["check"]
  # covr exercises the fallback backend; libidn2 is optional here, which keeps
  # this job free of system deps.
  script:
    - Rscript -e 'pak::pak("deps::.", dependencies = TRUE); pak::pak(c("any::covr", "any::xml2"))'
    - >
      Rscript -e 'cov <- covr::package_coverage(quiet = FALSE);
      print(cov);
      covr::to_cobertura(cov)'
  coverage: '/^punycoder Coverage: \d+\.\d+\%/'
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      coverage_report:
        coverage_format: cobertura
        path: cobertura.xml

# ---------------------------------------------------------------------------
# Stage: deploy
# ---------------------------------------------------------------------------

# pkgdown site -> GitLab Pages. The old workflow pushed the built site to a
# `gh-pages` branch; GitLab Pages instead serves whatever this job leaves in
# `public/`, so nothing is committed and `docs/` stays gitignored.
pages:
  extends: .r
  stage: deploy
  needs: ["check"]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - apt-get update -qq && apt-get install -y --no-install-recommends git
    - *pandoc_script
    - Rscript -e 'pak::pak("deps::.", dependencies = TRUE); pak::pak("any::pkgdown")'
    # pkgdown renders EVERY top-level .md into the site --
    # pkgdown:::package_mds() hardcodes a skip list of README/NEWS/LICENSE,
    # so _pkgdown.yml has no setting that can exclude anything else. Left
    # alone this publishes the agent instruction files as AGENTS.html,
    # CLAUDE.html and friends next to the reference -- internal working
    # notes served as if they were user documentation, and folded into
    # search.json where they outrank real docs on ordinary queries
    # (SEOR-pibdjanz).
    #
    # A glob denylist (`rm -f AGENTS*.md CLAUDE*.md FP_*.md`) only widens as
    # agent-file FAMILIES are added by hand and stays fail-open for the next
    # unnamed one -- the leak reached four repos after being fixed in one,
    # for exactly that reason (SEOR-wqxhftpv). Keep-list instead: enumerate
    # what belongs on the site and move everything else out, so an unknown
    # file (GEMINI.md, CODEX.md, whatever comes next) defaults to private.
    #
    # `mv`, not `rm -f`, per pslr's precedent (see the comment above its own
    # `pages` job): move the source out of the tree rather than delete it, so
    # an excluded file stays recoverable within the job instead of being
    # destroyed outright. Either shape keeps pkgdown from ever seeing the
    # file, since this step runs before `build_site()`.
    #
    # Each keep-listed name is asserted present before anything is moved, so
    # a rename of one of them (README.md -> Readme.md, say) fails this job
    # loudly instead of silently dropping it off the site -- the fail-loud
    # property pslr's job has for its (denylisted) agent files, carried over
    # here for the (keep-listed) site files instead.
    #
    # ARCHITECTURE.md and DECISIONS.md are grandfathered onto KEEP, not
    # newly authorized: both were already live on the deployed site
    # (ARCHITECTURE.html and DECISIONS.html both 200 at the time this landed,
    # now under https://bart-turczynski.gitlab.io/punycoder/) when the first
    # cut of this keep-list would otherwise have retired them on the next
    # merge. SEOR-wqxhftpv is about stopping an UNKNOWN new file from
    # leaking through; un-publishing an already-published page is a
    # separate editorial decision, made deliberately here rather than as a
    # side effect of closing that leak. cran-comments.md was NOT
    # grandfathered -- nothing links to it and it was never verified live.
    - |
      set -eu
      KEEP="README.md NEWS.md LICENSE.md CONTRIBUTING.md SECURITY.md CODE_OF_CONDUCT.md THIRD_PARTY_NOTICES.md ACKNOWLEDGMENTS.md ARCHITECTURE.md DECISIONS.md"
      for f in $KEEP; do
        if [ ! -f "$f" ]; then
          echo "ERROR: expected top-level file '$f' is missing -- update KEEP in .gitlab-ci.yml or restore the file." >&2
          exit 1
        fi
      done
      mkdir -p /tmp/agent-md
      for f in *.md; do
        case " $KEEP " in
          *" $f "*) : ;;
          *) mv "$f" /tmp/agent-md/ ;;
        esac
      done
    - Rscript -e 'pkgdown::build_site(new_process = FALSE, install = TRUE)'
    - rm -rf public && mv docs public
  artifacts:
    paths:
      - public

# codemeta.json regeneration.
#
# The old workflow regenerated the file and pushed the result back to main.
# That is not portable as-is for two reasons: CI_JOB_TOKEN cannot push to the
# repository (it would need a project access token with write scope), and the
# committed codemeta.json now carries hand-set GitLab URLs -- `contIntegration`
# points at the pipelines page -- that codemetar cannot infer and would clobber.
# So this is manual and artifact-only: run it, download codemeta.json, diff it
# against the committed one, and merge in what is genuinely new.
codemeta:
  extends: .r
  stage: deploy
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
      allow_failure: true
  script:
    - Rscript -e 'pak::pak("deps::.", dependencies = TRUE); pak::pak("any::codemetar")'
    - Rscript -e 'codemetar::write_codemeta(".")'
    - git --no-pager diff -- codemeta.json || true
  artifacts:
    expire_in: 1 month
    paths:
      - codemeta.json

# ---------------------------------------------------------------------------
# Stage: audit — scheduled dependency vulnerability scans
#
# The GitHub workflows carried their own `schedule:` cron. GitLab keeps
# schedules outside the file, so these two jobs key off the pipeline schedule
# itself: schedule 4427280 (Build > Pipeline schedules -> "Weekly dependency
# vulnerability audits (osv-audit, security-audit)", ref refs/heads/main).
#
# SEOR-ihmntqzm is the second schedule this comment warned about: `full-check`
# and `sanitizers` (stage: check) run off a weekly deep-check schedule, so
# `$CI_PIPELINE_SOURCE == "schedule"` alone is not a safe guard here -- it
# would fire these two audits on THAT schedule too. Both rules below also
# require `$SCHEDULE_KIND == "dependency-audit"` (see the SCHEDULE_KIND
# comment near the top of this file). Schedule 4427280 carries that CI/CD
# variable: confirmed live 2026-09-24 via
# `glab api projects/bart-turczynski%2Fpunycoder/pipeline_schedules/4427280`
# (variables: SCHEDULE_KIND=dependency-audit). If the audits ever go quiet,
# check that variable first.
#
# The only other way in is a hand-started `web` pipeline (manual,
# allow_failure). The old third rule -- run on main whenever DESCRIPTION, the
# audit test or this file changed -- is gone (SEOR-fftbjnpl): the rule is
# "the dependency-audit schedule, else never", shared with seor's template.
# With security-audit now failing on missing credentials, that rule would
# also have turned an ordinary merge that touched this file red on main.
# ---------------------------------------------------------------------------

.audit:
  extends: .r
  stage: audit
  variables:
    R_LIBS_USER: "$CI_PROJECT_DIR/.Rlibs"
    # Belt and braces so skip_on_cran() in the audit tests cannot skip the
    # audit silently. testthat::test_local() does set NOT_CRAN=true itself
    # (measured on testthat 3.3.2; see the header of test-security.R), but
    # keeping it explicit costs nothing and does not lean on that detail.
    NOT_CRAN: "true"
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE_KIND == "dependency-audit"
    # Under `rules`, `when: manual` defaults to `allow_failure: false`, which
    # would leave a hand-started pipeline blocked on a job nobody meant to
    # gate on. The allow_failure line is load-bearing.
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
      allow_failure: true
    - when: never

# Dependency vulnerability audit against the OSV database (https://osv.dev) via
# {rosv}. Unlike security-audit (Sonatype OSS Index), OSV requires no account,
# token, or CI/CD variables, and has first-class CRAN coverage.
osv-audit:
  extends: .audit
  script:
    - Rscript -e 'pak::pak("deps::.", dependencies = TRUE); pak::pak(c("any::rosv", "any::testthat", "local::."))'
    - Rscript -e 'testthat::test_local(filter = "osv", stop_on_failure = TRUE)'

# Dependency vulnerability audit against the Sonatype OSS Index via {oysteR}.
# OSS Index requires authentication (anonymous requests get HTTP 401), so this
# job needs two CI/CD variables (Settings > CI/CD > Variables):
#
#   OSSINDEX_USER   - the literal placeholder `x`, NOT the account email
#   OSSINDEX_TOKEN  - a Sonatype Guide personal access token (`sonatype_pat_*`)
#
# OSS Index moved to Sonatype Guide, whose help says the basic-auth username is
# ignored for a PAT. It is not: with the account email as username a valid PAT
# returns HTTP 401, and with `x` the same token returns 200 (measured in
# pagerankr 2026-07-25 by changing only OSSINDEX_USER). A local
# `curl -u 'x:$PAT'` that succeeds while this job 401s is this, not a bad
# token. A legacy OSS Index API token, if one is ever rotated back in, is the
# case that takes the email.
#
# THIS JOB FAILS WHEN THEY ARE ABSENT, ON PURPOSE (SEOR-fftbjnpl). It used to
# skip cleanly and stay green: the GitHub repository secrets did not follow
# the move, so every run reported success having audited nothing
# (PUNY-rsxtbbln). OSSINDEX_AUDIT_REQUIRED turns each missing precondition in
# tests/testthat/test-security.R (oysteR not installed, credentials absent)
# into a loud failure instead of a skip. It is set here and nowhere else, so
# local runs, the pre-push gate and `R CMD check` still skip.
#
# OWNER GATE -- the variables cannot be set from a merge request:
#
#   glab variable set OSSINDEX_TOKEN '<Sonatype Guide PAT>' \
#     --masked --repo bart-turczynski/punycoder
#   glab variable set OSSINDEX_USER 'x' \
#     --repo bart-turczynski/punycoder
#
# OSSINDEX_USER is not `--masked`: `x` is not a secret, and GitLab rejects
# masking a value shorter than 8 characters. Only the token is the secret.
# Until both exist, a scheduled run of this job is red and says exactly why.
security-audit:
  extends: .audit
  variables:
    OSSINDEX_AUDIT_REQUIRED: "true"
  script:
    - Rscript -e 'pak::pak("deps::.", dependencies = TRUE); pak::pak(c("any::oysteR", "any::testthat", "local::."))'
    - Rscript -e 'testthat::test_local(filter = "security", stop_on_failure = TRUE)'
