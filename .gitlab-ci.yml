# GitLab CI for punycoder.
#
# This replaces the eight GitHub Actions workflows that used to live in
# `.github/workflows/`. That whole tree was removed when the project went
# GitLab-only (PUNY-beydmanp): the GitHub account that ran it is suspended, so
# none of those workflows could execute any more.
#
# Job-name map from the workflows they replace, because CONTRIBUTING.md and
# `.bestpractices.json` cite job names:
#
#   verify.yml         -> lint, readme, check, coverage
#   news-version.yaml  -> news-version
#   full-check.yml     -> full-check (R-version matrix; see the note on it)
#   pkgdown.yaml       -> pages
#   codemeta.yaml      -> codemeta (manual, artifact-only; see the note on it)
#   osv-audit.yml      -> osv-audit
#   security-audit.yml -> security-audit
#   rhub.yaml          -> sanitizers (R-hub's containers, run directly)
#
# The merge gate is `lint` + `readme` + `news-version` + `citation-version` +
# `check` + `coverage`. Everything else is manual, tag-triggered, or
# scheduled.

stages:
  - lint
  - check
  - report
  - deploy
  - audit

workflow:
  rules:
    # One pipeline per merge, not three (SEOR-bmgkzhvy). This used to allow
    # both merge-request and branch pipelines (suppressing the branch one only
    # when an MR was already open, GitLab's standard duplicate-pipeline
    # guard). That guard turned out not to be enough: on a concurrency-1
    # shared runner the branch and MR pipelines test the same tree as the
    # pipeline that eventually runs on main, and the useless ones get created
    # first -- so they hold the runner's only slot while the pipeline that
    # actually gates the work queues behind them. Measured repeatedly: a
    # merged, branch-deleted MR's own pipeline held the runner for 36+ minutes
    # while main sat pending. So both are suppressed outright and only main
    # (plus tags) gets a pipeline.
    #
    # Cost, stated plainly: a feature-branch push gets no CI at all -- that is
    # the point, not an oversight. An API-triggered pipeline on a non-default
    # branch also gets nothing, because $CI_COMMIT_BRANCH is set but isn't
    # $CI_DEFAULT_BRANCH, so it falls through to the last rule.
    #
    # A `web` pipeline is the deliberate exception, and it is what makes the
    # cost above bearable: someone has to open Build > Pipelines > Run
    # pipeline and choose a ref, so it cannot fire on its own and cannot
    # recreate the pile-up above, which was entirely push- and
    # merge-request-driven. Started against a feature branch it runs the whole
    # merge gate on that branch, and puts full-check and sanitizers one click
    # away -- which is exactly what one wants to run BEFORE merging, not
    # after. `pages` stays pinned to the default branch, so the hatch verifies
    # a branch and never publishes one.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"
    - when: never

# ---------------------------------------------------------------------------
# Shared R setup
#
# rocker/r-ver pins Posit Package Manager as the CRAN mirror, so
# `install.packages()` resolves Ubuntu *binaries* rather than compiling from
# source — the equivalent of `use-public-rspm: true` in the r-lib actions.
# {pak} does the dependency resolution and, running as root on a supported
# distro, installs each package's declared system requirements itself, so the
# apt lines below are only for things no R package declares (libidn2 for this
# package's optional backend, qpdf/ghostscript for --compact-vignettes).
# Pandoc is separate and pinned -- see the .pandoc block.
#
# `dependencies = TRUE` on the `deps::.` ref is not optional: without it pak
# resolves hard dependencies only, and `R CMD build` then dies with "vignette
# builder 'knitr' not found" because knitr and testthat are Suggests.
# ---------------------------------------------------------------------------
.r:
  image: rocker/r-ver:latest
  interruptible: true
  variables:
    R_LIBS_USER: "$CI_PROJECT_DIR/.Rlibs"
    R_KEEP_PKG_SOURCE: "yes"
    # Never set NOT_CRAN globally: it would un-skip test-osv.R and
    # test-security.R inside R CMD check, where their network access and
    # credentials are absent. The two audit jobs set it deliberately.
  cache:
    key: "rlibs-$CI_JOB_NAME_SLUG"
    paths:
      - .Rlibs/
  before_script:
    - mkdir -p "$R_LIBS_USER"
    - Rscript -e 'if (!requireNamespace("pak", quietly = TRUE)) install.packages("pak")'

# Pandoc is PINNED, and the pin is load-bearing rather than tidiness.
#
# The `readme` job asserts that README.md is byte-identical to a fresh knit of
# README.Rmd, and pandoc's markdown writer changes its table layout between
# versions: the committed README carries compact pipe tables, while Ubuntu's
# apt pandoc (3.1.x) rewrites every table column-padded. The job then fails on
# whitespace, reporting "out of sync" for a reason that has nothing to do with
# the content. The GitHub workflow this replaced hid the problem by using
# setup-pandoc, which installs a pinned build.
#
# 3.10 is the version that reproduces the committed README.md byte for byte
# (verified locally). If you bump it, re-knit README.md in the same change and
# check that a maintainer's local pandoc matches, or the job goes red for
# everyone.
#
# The download is from pandoc's own release host. That is upstream software
# distribution, not a forge dependency -- the same category as the R-hub
# container images below.
#
# Written as a plain YAML anchor rather than `!reference`, deliberately: the
# pre-commit `check-yaml` hook parses this file with a safe loader and cannot
# construct GitLab's custom `!reference` tag, so using it makes every commit
# fail on an unresolvable constructor. GitLab flattens a nested array in
# `script`, so an anchor splices in exactly the same way.
#
# The ARCHITECTURE is derived, never asserted. pandoc ships one .deb per
# architecture (3.10 publishes both amd64 and arm64) and `dpkg -i` refuses a
# package built for another one, so a hardcoded `-amd64` takes out every job
# that splices this anchor the moment the runner is not x86_64 -- which is what
# happened the first time this pipeline ran on the project's own runner, a
# local gitlab-runner on Apple Silicon where Docker resolves rocker/r-ver to
# arm64. `dpkg --print-architecture` spells the value exactly as pandoc names
# its assets. It is command substitution rather than a variable on purpose:
# GitLab expands $VAR itself before the shell ever runs, but leaves $( ) alone,
# so this is evaluated in the container it has to describe.
#
# `dpkg -i` is bare, with no `|| apt-get install -f -y` fallback: the .deb is a
# self-contained binary with nothing to fix up, and the fallback only swallowed
# dpkg's exit status so the job died 200 lines later at `pandoc: command not
# found` instead of at the install that actually failed.
.pandoc_script: &pandoc_script
  - PANDOC_VERSION=3.10
  - apt-get update -qq && apt-get install -y --no-install-recommends curl ca-certificates
  - curl -fsSL -o /tmp/pandoc.deb "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-1-$(dpkg --print-architecture).deb"
  - dpkg -i /tmp/pandoc.deb
  - pandoc --version | head -n1

# ---------------------------------------------------------------------------
# Stage: lint — the fast checks, run on every push and merge request
# ---------------------------------------------------------------------------

lint:
  extends: .r
  stage: lint
  variables:
    # {lintr} reads this and turns any lint into a non-zero exit.
    LINTR_ERROR_ON_LINT: "true"
  script:
    - Rscript -e 'pak::pak("deps::.", dependencies = TRUE); pak::pak("any::lintr")'
    - Rscript -e 'lintr::lint_package()'

readme:
  extends: .r
  stage: lint
  # devtools::build_readme() installs the package (README.Rmd has a live
  # `library(punycoder)` chunk) and re-knits it. libidn2 is deliberately absent
  # here: the README's output is backend-independent, and the fallback path
  # keeps this job free of system deps.
  script:
    - apt-get update -qq && apt-get install -y --no-install-recommends git
    - *pandoc_script
    - Rscript -e 'pak::pak("deps::.", dependencies = TRUE); pak::pak("any::devtools")'
    - Rscript -e 'devtools::build_readme()'
    - |
      if ! git diff --exit-code -- README.md; then
        echo "ERROR: README.md is out of sync with README.Rmd."
        echo "Run devtools::build_readme() and commit the result."
        exit 1
      fi

news-version:
  stage: lint
  image: debian:stable-slim
  interruptible: true
  # Lightweight guard against NEWS/DESCRIPTION version drift. The top NEWS.md
  # heading must be either "(development version)" or exactly the DESCRIPTION
  # Version. This catches a stale "(development version)" heading left in place
  # at release time (as happened for 1.0.0).
  script:
    - |
      set -eu
      version="$(grep -E '^Version:' DESCRIPTION | head -n1 | sed -E 's/^Version:[[:space:]]*//')"
      heading="$(grep -m1 -E '^# ' NEWS.md | sed -E 's/^#[[:space:]]+punycoder[[:space:]]*//')"
      echo "DESCRIPTION Version : '$version'"
      echo "Top NEWS heading    : '$heading'"
      if [ "$heading" = "(development version)" ] || [ "$heading" = "$version" ]; then
        echo "OK: NEWS heading and version are consistent."
      else
        echo "ERROR: top NEWS.md heading ('$heading') is neither '(development version)' nor the DESCRIPTION Version ('$version'). Update NEWS.md before release."
        exit 1
      fi
    # Release paperwork that no generator keeps current: .zenodo.json feeds the
    # Zenodo archive of each release (the version field is citation metadata --
    # omitting it would make Zenodo fall back to the tag, i.e. 'v1.2.1' rather
    # than '1.2.1'), and _pkgdown.yml links the release on the news page. Both
    # silently went stale at 1.2.0 while 1.2.1 shipped (PUNY-aaheyvva). Checked
    # only on a RELEASE version: during development DESCRIPTION carries a .9000
    # suffix and these two correctly still name the last actual release.
    - |
      set -eu
      version="$(grep -E '^Version:' DESCRIPTION | head -n1 | sed -E 's/^Version:[[:space:]]*//')"
      case "$version" in
        *.9000)
          echo "Development version ('$version'); release paperwork not checked."
          exit 0
          ;;
      esac

      status=0

      zenodo="$(grep -E '"version"' .zenodo.json | head -n1 | sed -E 's/.*"version"[[:space:]]*:[[:space:]]*"([^"]*)".*/\1/')"
      if [ "$zenodo" = "$version" ]; then
        echo "OK: .zenodo.json version is '$zenodo'."
      else
        echo "ERROR (.zenodo.json): version ('$zenodo') does not match the DESCRIPTION Version ('$version')."
        status=1
      fi

      if grep -q "tags/v$version\$" _pkgdown.yml; then
        echo "OK: _pkgdown.yml links the v$version release."
      else
        echo "ERROR (_pkgdown.yml): does not link the v$version release tag. Update the news.releases entry."
        status=1
      fi

      exit "$status"

# CITATION.cff and .zenodo.json each duplicate the version and the project
# URLs out of DESCRIPTION. Measured 2026-09-11, punycoder's CITATION.cff named
# a stale released version (1.2.0) after 1.2.1 shipped, the same class of drift
# as the release-paperwork check above but for a file that check does not
# touch. The rule is seor's
# design/adr/0001-citation-metadata-names-the-release.md: version: and
# "version" carry the release DESCRIPTION's Version: names (X.Y.Z.9000 ->
# X.Y.Z). Offline, stdlib-only Python, so it runs in seconds without the R
# image - same shape as news-version above.
citation-version:
  stage: lint
  image: python:3.13-alpine
  script:
    - python3 scripts/check-citation.py --self-test
    - python3 scripts/check-citation.py

# ---------------------------------------------------------------------------
# Stage: check
# ---------------------------------------------------------------------------

check:
  extends: .r
  stage: check
  needs: ["lint"]
  # Install the optional libidn2 backend so the native path and the
  # libidn2-vs-fallback parity tests actually exercise on CI.
  script:
    - apt-get update -qq && apt-get install -y --no-install-recommends libidn2-0-dev pkg-config qpdf ghostscript
    - *pandoc_script
    - Rscript -e 'pak::pak("deps::.", dependencies = TRUE); pak::pak("any::rcmdcheck")'
    - >
      Rscript -e 'rcmdcheck::rcmdcheck(args = "--no-manual",
      build_args = c("--no-manual", "--compact-vignettes=gs+qpdf"),
      error_on = "warning", check_dir = "check")'
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - check/

# Cross-platform coverage is the one thing leaving GitHub genuinely cost: this
# project has no macOS or Windows runner any more. What replaces it, per
# CONTRIBUTING.md's release checklist, is R's own pre-submission services --
# win-builder (devtools::check_win_devel()) and the macOS builder at
# https://mac.r-project.org/macbuilder/submit.html -- which are forge-independent
# and are what CRAN itself mirrors. This job keeps the R-VERSION half of the old
# matrix (devel / release / oldrel-1) on Linux.
#
# Runs on release tags ('v*') and on demand; routine merges and MRs use `check`.
full-check:
  extends: .r
  stage: check
  image: $R_IMAGE
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
      allow_failure: true
  parallel:
    matrix:
      # 'latest' tracks the current R release; bump the pinned oldrel-1 tag
      # when a new minor R version ships.
      - R_IMAGE:
          - "rocker/r-ver:latest"
          - "rocker/r-ver:4.5"
          - "rocker/r-ver:devel"
  script:
    - apt-get update -qq && apt-get install -y --no-install-recommends libidn2-0-dev pkg-config qpdf ghostscript
    - *pandoc_script
    - Rscript -e 'pak::pak("deps::.", dependencies = TRUE); pak::pak("any::rcmdcheck")'
    # The strict CRAN-grade pass: --as-cran. This is what CRAN itself runs, so
    # it is the gate before a release.
    - >
      Rscript -e 'rcmdcheck::rcmdcheck(args = c("--no-manual", "--as-cran"),
      build_args = c("--no-manual", "--compact-vignettes=gs+qpdf"),
      error_on = "warning", check_dir = "check")'
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - check/

# Dynamic analysis of the C/C++ codec core, replacing rhub.yaml.
#
# R-hub v2 is GitHub-Actions-native -- `rhub::rhub_setup()` writes a workflow
# and `rhub::rhub_check()` dispatches it -- so there is nothing to port. But
# R-hub publishes its check environments as ordinary OCI images, and those run
# anywhere: this job pulls the clang-ASAN/UBSAN and valgrind containers
# directly and runs the check inside them. Same sanitizers, no GitHub.
#
# Manual and allow_failure: sanitizer runs are slow and their output is for
# reading, not for gating a merge. Run before a release, per CONTRIBUTING.md.
sanitizers:
  stage: check
  image: ghcr.io/r-hub/containers/$RHUB_CONTAINER
  interruptible: true
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
      when: manual
      allow_failure: true
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
      allow_failure: true
  parallel:
    matrix:
      - RHUB_CONTAINER: ["clang-asan", "valgrind"]
  variables:
    R_LIBS_USER: "$CI_PROJECT_DIR/.Rlibs"
  script:
    - mkdir -p "$R_LIBS_USER"
    - Rscript -e 'if (!requireNamespace("pak", quietly = TRUE)) install.packages("pak")'
    - Rscript -e 'pak::pak("deps::.", dependencies = TRUE)'
    - R CMD build --no-build-vignettes --no-manual .
    - R CMD check --no-manual --no-build-vignettes punycoder_*.tar.gz
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      # R CMD check run directly writes punycoder.Rcheck/ into the working
      # directory; the two rcmdcheck jobs redirect theirs to check/ instead.
      - "*.Rcheck/"

# ---------------------------------------------------------------------------
# Stage: report
# ---------------------------------------------------------------------------

# Coverage now goes to GitLab's native coverage reporting (the pipeline badge,
# the MR coverage diff, and the per-file annotations from the Cobertura report)
# rather than to Codecov. The old Codecov project was linked to the GitHub
# repository and cannot follow the move; GitLab's built-in reporting needs no
# external account and no token.
coverage:
  extends: .r
  stage: report
  needs: ["check"]
  # covr exercises the fallback backend; libidn2 is optional here, which keeps
  # this job free of system deps.
  script:
    - Rscript -e 'pak::pak("deps::.", dependencies = TRUE); pak::pak(c("any::covr", "any::xml2"))'
    - >
      Rscript -e 'cov <- covr::package_coverage(quiet = FALSE);
      print(cov);
      covr::to_cobertura(cov)'
  coverage: '/^punycoder Coverage: \d+\.\d+\%/'
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      coverage_report:
        coverage_format: cobertura
        path: cobertura.xml

# ---------------------------------------------------------------------------
# Stage: deploy
# ---------------------------------------------------------------------------

# pkgdown site -> GitLab Pages. The old workflow pushed the built site to a
# `gh-pages` branch; GitLab Pages instead serves whatever this job leaves in
# `public/`, so nothing is committed and `docs/` stays gitignored.
pages:
  extends: .r
  stage: deploy
  needs: ["check"]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - apt-get update -qq && apt-get install -y --no-install-recommends git
    - *pandoc_script
    - Rscript -e 'pak::pak("deps::.", dependencies = TRUE); pak::pak("any::pkgdown")'
    - Rscript -e 'pkgdown::build_site(new_process = FALSE, install = TRUE)'
    - rm -rf public && mv docs public
  artifacts:
    paths:
      - public

# codemeta.json regeneration.
#
# The old workflow regenerated the file and pushed the result back to main.
# That is not portable as-is for two reasons: CI_JOB_TOKEN cannot push to the
# repository (it would need a project access token with write scope), and the
# committed codemeta.json now carries hand-set GitLab URLs -- `contIntegration`
# points at the pipelines page -- that codemetar cannot infer and would clobber.
# So this is manual and artifact-only: run it, download codemeta.json, diff it
# against the committed one, and merge in what is genuinely new.
codemeta:
  extends: .r
  stage: deploy
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
      allow_failure: true
  script:
    - Rscript -e 'pak::pak("deps::.", dependencies = TRUE); pak::pak("any::codemetar")'
    - Rscript -e 'codemetar::write_codemeta(".")'
    - git --no-pager diff -- codemeta.json || true
  artifacts:
    expire_in: 1 month
    paths:
      - codemeta.json

# ---------------------------------------------------------------------------
# Stage: audit — scheduled dependency vulnerability scans
#
# The GitHub workflows carried their own `schedule:` cron. GitLab keeps
# schedules outside the file, so these two jobs key off the pipeline schedule
# itself (Build > Pipeline schedules -> "Weekly dependency vulnerability
# audits", Mondays 04:17 UTC). That project has exactly one schedule and this
# is what it is for; if a second schedule is ever added for something else,
# reintroduce a guard variable here so the audits do not run on it.
#
# Both jobs also run on demand from a web-triggered pipeline, and on main when
# their own inputs change.
# ---------------------------------------------------------------------------

.audit:
  extends: .r
  stage: audit
  variables:
    R_LIBS_USER: "$CI_PROJECT_DIR/.Rlibs"
    # testthat::test_local() does not set NOT_CRAN, so set it here or
    # skip_on_cran() in the audit tests would skip the audit silently.
    NOT_CRAN: "true"

# Dependency vulnerability audit against the OSV database (https://osv.dev) via
# {rosv}. Unlike security-audit (Sonatype OSS Index), OSV requires no account,
# token, or CI/CD variables, and has first-class CRAN coverage.
osv-audit:
  extends: .audit
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
      allow_failure: true
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - DESCRIPTION
        - tests/testthat/test-osv.R
        - .gitlab-ci.yml
  script:
    - Rscript -e 'pak::pak("deps::.", dependencies = TRUE); pak::pak(c("any::rosv", "any::testthat", "local::."))'
    - Rscript -e 'testthat::test_local(filter = "osv", stop_on_failure = TRUE)'

# Dependency vulnerability audit against the Sonatype OSS Index via {oysteR}.
# OSS Index requires authentication (anonymous requests get HTTP 401), so this
# job needs two masked CI/CD variables (Settings > CI/CD > Variables):
#
#   OSSINDEX_USER   - OSS Index account email (https://ossindex.sonatype.org)
#   OSSINDEX_TOKEN  - OSS Index API token
#
# These were GitHub repository secrets and did not follow the move; until they
# are re-added here, test-security.R skips cleanly and this job passes green
# without auditing anything.
security-audit:
  extends: .audit
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
      allow_failure: true
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - DESCRIPTION
        - tests/testthat/test-security.R
        - .gitlab-ci.yml
  script:
    - Rscript -e 'pak::pak("deps::.", dependencies = TRUE); pak::pak(c("any::oysteR", "any::testthat", "local::."))'
    - Rscript -e 'testthat::test_local(filter = "security", stop_on_failure = TRUE)'
